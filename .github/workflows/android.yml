name: Build Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/Project.xml') }}

      - name: Install libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime          8.3.2  --quiet
          haxelib install openfl        9.3.3  --quiet
          haxelib install flixel        6.1.2  --quiet
          haxelib install flixel-addons 4.0.1  --quiet
          haxelib install flixel-ui            --quiet
          haxelib install hscript              --quiet
          haxelib run lime setup openfl

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-r25c
          key: ndk-r25c

      - name: Download NDK r25c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" \
            -o "${{ runner.temp }}/ndk.zip"
          unzip -q "${{ runner.temp }}/ndk.zip" -d "${{ runner.temp }}"

      - name: Configure Android
        run: |
          printf '%s\n%s\n%s\n' \
            "$ANDROID_HOME" \
            "${{ runner.temp }}/android-ndk-r25c" \
            "$JAVA_HOME" \
            | haxelib run lime setup android
          haxelib run lime config ANDROID_NDK_ROOT "${{ runner.temp }}/android-ndk-r25c"

      - name: Build APK
        run: haxelib run lime build android -release

      - name: Locate APK
        run: |
          FILE=$(find export/release/android/bin -name "*.apk" \
            ! -name "*unaligned*" ! -name "*unsigned*" | head -1)
          echo "APK_PATH=$FILE" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-0.4.2-Android
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: "Psych Engine 0.4.2 Android — ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
