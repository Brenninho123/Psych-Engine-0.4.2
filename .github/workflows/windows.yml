name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: C:\HaxeToolkit\haxe\lib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/Project.xml') }}

      - name: Install libraries
        shell: powershell
        run: |
          haxelib setup C:\HaxeToolkit\haxe\lib
          haxelib install lime          8.3.2  --quiet
          haxelib install openfl        9.5.2  --quiet
          haxelib install flixel        6.1.2  --quiet
          haxelib install flixel-addons 4.0.1  --quiet
          haxelib install flixel-ui            --quiet
          haxelib install hscript              --quiet
          haxelib run lime setup openfl

      - name: Build EXE
        shell: powershell
        run: |
          haxelib run lime build windows -release

      - name: Zip Build
        shell: powershell
        run: |
          Compress-Archive `
            -Path export\release\windows\bin\* `
            -DestinationPath PsychEngine-Windows.zip

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-0.4.2-Windows
          path: PsychEngine-Windows.zip
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PsychEngine-Windows.zip
          name: "Psych Engine 0.4.2 Windows — ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
